spring:
  application:
    name: adbrew-profitability-engine
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    mongodb:
      uri: ${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/adbrew_engine}}
      auto-index-creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    try-it-out-enabled: true
    doc-expansion: list

# Nightly bid/budget optimization pass. Safe to leave enabled for the demo;
# POST /api/recommendations/run/{accountId} is the interactive equivalent.
adbrew:
  optimization:
    cron: "0 0 2 * * *"

logging:
  level:
    com.adbrew: INFO
    org.springframework.data.mongodb.core.MongoTemplate: WARN
